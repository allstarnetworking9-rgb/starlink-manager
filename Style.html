<style>

    --line: rgba(168, 185, 255, 0.16);

    --radius-md: 16px;

  }

    min-height: 100vh;
    font-family: "Manrope", sans-serif;

  }

    min-height: 100vh;
  }

  .sidebar-panel {
    width: 320px;
    padding: 28px 24px;
    border-right: 1px solid var(--line);
    background: linear-gradient(180deg, rgba(11, 18, 33, 0.95) 0%, rgba(9, 16, 30, 0.9) 100%);

    top: 0;
    height: 100vh;
    display: flex;
    flex-direction: column;
    gap: 28px;
  }

  .brand-panel,
  .sidebar-note,
  .module-hero,
  .summary-card,
  .customer-table-card,
  .loading-card,
  .modal-content {
    border: 1px solid var(--line);
    background: var(--panel);
    backdrop-filter: blur(18px);
    box-shadow: var(--shadow-lg);

  .brand-overline,
  .workspace-overline,
  .hero-kicker,
  .modal-kicker,
  .sidebar-note-label {

  .brand-title,
  .workspace-title,
  .hero-title {
    font-family: "Fraunces", serif;
    letter-spacing: -0.03em;
  }

  .brand-title {
    font-size: 1.35rem;
  }

  .module-nav {
    display: grid;
    gap: 12px;
  }

  .nav-chip {

    border-radius: 18px;

    align-items: center;
    gap: 12px;

  .nav-chip.active {

    padding: 18px;

    color: #d8fff0;
    font-weight: 700;

    height: 10px;

    line-height: 1.7;

    align-items: center;
    gap: 8px;
    border-radius: 16px;

    box-shadow: 0 16px 30px var(--accent-glow);

  .btn-primary:focus {
    background: linear-gradient(135deg, #6897ff, #3f73fa);
    border-color: transparent;
  }

  .btn-light,
  .btn-danger {
    border-radius: 16px;
    font-weight: 800;
  }

  .summary-card {
    min-height: 100%;
    padding: 20px;
    display: flex;
    align-items: center;
    gap: 16px;
  }

    background: linear-gradient(180deg, rgba(91, 140, 255, 0.16), rgba(14, 23, 40, 0.84));
  }

  .summary-card-active {
    background: linear-gradient(180deg, rgba(60, 211, 159, 0.16), rgba(14, 23, 40, 0.84));
  }

  .summary-card-disabled {
    background: linear-gradient(180deg, rgba(255, 107, 122, 0.16), rgba(14, 23, 40, 0.84));
  }

  .summary-card-expired {
    background: linear-gradient(180deg, rgba(255, 191, 102, 0.16), rgba(14, 23, 40, 0.84));

    height: 56px;

    place-items: center;

    text-transform: uppercase;

    font-size: 2rem;
    font-weight: 800;
  }

  .form-select:focus {

    border-color: rgba(91, 140, 255, 0.72);

    color: var(--text);
  }

  textarea.form-control {
    min-height: auto;
  }

  .form-label,
  .form-text {
    color: var(--muted);
  }

  .page-size-select {
    width: 92px;
  }

  .customer-table {
    --bs-table-bg: transparent;
    --bs-table-color: var(--text);

    margin-bottom: 0;

    padding-top: 1rem;
    padding-bottom: 1rem;

  .customer-name {
    font-weight: 800;
    font-size: 1rem;
  }

  .customer-subcopy {
    font-size: 0.86rem;
    color: var(--muted);
  }

    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 8px 12px;
    border-radius: 999px;
    font-size: 0.8rem;
    font-weight: 800;
  }

  .pill-status-active {
    color: #d9fff1;
    background: rgba(60, 211, 159, 0.12);
  }

  .pill-status-disabled {
    color: #ffe2e6;
    background: rgba(255, 107, 122, 0.12);
  }

  .row-actions {

    height: 42px;

    place-items: center;
    transition: 0.2s ease;

  .row-action-btn:hover {

    border-color: rgba(91, 140, 255, 0.42);
    background: rgba(91, 140, 255, 0.1);
  }

  .row-action-btn.row-action-delete:hover {

    background: rgba(255, 107, 122, 0.12);

    border: 1px dashed rgba(255, 255, 255, 0.14);
    border-radius: var(--radius-lg);
    padding: 48px 24px;
    text-align: center;
    background: rgba(255, 255, 255, 0.02);
  }

  .empty-state-icon {
    width: 72px;
    height: 72px;

    border-radius: 24px;
    display: grid;
    place-items: center;
    background: rgba(91, 140, 255, 0.12);

  .empty-state-title {

    margin-bottom: 10px;

    justify-content: space-between;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;

    gap: 8px;
  }

  .page-link {
    background: rgba(255, 255, 255, 0.04);

    text-align: center;
  }

  .page-link:hover,
  .page-item.active .page-link {

    border-color: rgba(91, 140, 255, 0.38);

  }

  .page-item.disabled .page-link {
    background: rgba(255, 255, 255, 0.02);
    color: rgba(231, 237, 249, 0.35);
  }

  .delete-customer-box {
    border-radius: var(--radius-md);
    border: 1px solid rgba(255, 107, 122, 0.18);
    background: rgba(255, 107, 122, 0.08);
    padding: 16px;
    color: #ffe9ed;
  }

  .loading-overlay {
    position: fixed;
    inset: 0;
    background: rgba(5, 8, 16, 0.75);
    backdrop-filter: blur(8px);
    z-index: 2000;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .loading-card {
    padding: 24px 28px;
    border-radius: 24px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    align-items: center;
  }

  .loading-text {
    color: #eaf1ff;
    font-weight: 700;
  }

  .toast {
    background: linear-gradient(135deg, rgba(12, 20, 36, 0.98), rgba(16, 27, 49, 0.98));
    color: #fff;
    border-radius: 18px;
    box-shadow: var(--shadow-lg);
  }

  .toast.toast-success {
    border-left: 4px solid var(--success);
  }

  .toast.toast-error {
    border-left: 4px solid var(--danger);
  }

  .toast.toast-info {
    border-left: 4px solid var(--accent);
  }

  .invalid-feedback {
    display: none;
  }

  .form-control.is-invalid,
  .form-select.is-invalid {
    border-color: rgba(255, 107, 122, 0.7);
  }

  .form-select.is-invalid ~ .invalid-feedback {

  }

      width: 100%;
      height: auto;
      position: relative;
      border-right: 0;
      border-bottom: 1px solid var(--line);
    }
  }

  @media (max-width: 767.98px) {
    .workspace-panel {
      padding: 20px;
    }

    .workspace-header {
      flex-direction: column;
      align-items: flex-start;
    }

    .toolbar,
    .pagination-bar {
      flex-direction: column;
      align-items: stretch;
    }

    .search-box {
      min-width: 100%;
    }
